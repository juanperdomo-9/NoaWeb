<!DOCTYPE html>
<html>

<head>

    <title>Hero Editor</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black text-white min-h-screen p-6 md:p-12">

<div class="max-w-3xl mx-auto">

    <h1 class="text-4xl font-black mb-10">
        🎨 Hero Editor
    </h1>

    <form method="POST"
          enctype="multipart/form-data"
          class="space-y-6 bg-zinc-900 p-8 rounded-3xl border border-zinc-800">

        {% csrf_token %}

        <div>

            <label class="block mb-2 text-zinc-400">
                Título
            </label>

            <input type="text"
                   name="title"
                   value="{{ hero.title }}"
                   class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl p-4">

        </div>

        <div>

            <label class="block mb-2 text-zinc-400">
                Subtítulo
            </label>

            <input type="text"
                   name="subtitle"
                   value="{{ hero.subtitle }}"
                   class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl p-4">

        </div>

        <div>

            <label class="block mb-2 text-zinc-400">
                Texto botón
            </label>

            <input type="text"
                   name="button_text"
                   value="{{ hero.button_text }}"
                   class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl p-4">

        </div>

        <div>

            <label class="block mb-2 text-zinc-400">
                Imagen Hero
            </label>

            <input type="file"
                   name="image_file"
                   class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl p-4">

        </div>

        {% if hero.image %}

        <img src="{{ hero.image }}"
             class="rounded-3xl w-full h-[350px] object-cover">

        {% endif %}

        <button
            class="w-full bg-white text-black py-5 rounded-2xl font-bold hover:scale-[1.02] transition">

            Guardar cambios

        </button>

    </form>

</div>

</body>
</html>
